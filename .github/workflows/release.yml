name: Build & publish

# On every push to main: build both images for amd64 + arm64, push them to
# GHCR tagged `main-<sha>` and `latest`, then rewrite the image tags in
# deploy/k8s/kustomization.yml and commit that back ([skip ci]). ArgoCD
# watches main and redeploys when those tags change.
#
# The cluster is mixed: two Orange Pi nodes (arm64) and one amd64 box, so
# multi-arch is a hard requirement, not a nicety.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit the tag bump back to main
  packages: write # push images to GHCR

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: manuel-alcocer

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Backend tests
        working-directory: backend
        run: |
          uv sync
          uv run ruff check .
          uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner emulate arm64 for the Python and nginx layers.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/hnf-${{ matrix.name }}:main-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/hnf-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Pin the new tag in the kustomization
        run: |
          set -e
          sed -i "s|newTag: .*|newTag: main-${GITHUB_SHA}|" deploy/k8s/kustomization.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet deploy/k8s/kustomization.yml; then
            echo "Tags already current, nothing to commit."
            exit 0
          fi
          git add deploy/k8s/kustomization.yml
          git commit -m "chore: deploy main-${GITHUB_SHA} [skip ci]"
          git push
