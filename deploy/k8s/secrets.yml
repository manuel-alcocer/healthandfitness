# Django SECRET_KEY. Generated once and never rotated (refreshInterval "0"):
# rotating it would invalidate every issued JWT and log everyone out.
# No symbols, so it survives unquoted in env vars.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hnf-secret-key
  namespace: hnf
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  length: 64
  digits: 16
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
# Application PostgreSQL password (no symbols so it survives unencoded inside
# the DATABASE_URL below).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hnf-db-password
  namespace: hnf
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  length: 48
  digits: 12
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
# Admin CLI token (X-Admin-Token for hnfctl) and the Django admin password.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hnf-admin-token
  namespace: hnf
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  length: 48
  digits: 12
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hnf-admin-password
  namespace: hnf
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  length: 24
  digits: 6
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
# One Secret carries both shapes of the same password: POSTGRES_PASSWORD for
# the init Job's psql, and the assembled DATABASE_URL django-environ reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hnf-db
  namespace: hnf
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "0"
  target:
    name: hnf-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        POSTGRES_PASSWORD: "{{ .db_password }}"
        DATABASE_URL: "postgres://hnf:{{ .db_password }}@postgresql.databases.svc.cluster.local:5432/hnf"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hnf-db-password
      rewrite:
        - transform:
            template: "db_password"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hnf-django
  namespace: hnf
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "0"
  target:
    name: hnf-django
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        SECRET_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hnf-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hnf-admin
  namespace: hnf
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "0"
  target:
    name: hnf-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        ADMIN_API_TOKEN: "{{ .admin_token }}"
        ADMIN_PASSWORD: "{{ .admin_password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hnf-admin-token
      rewrite:
        - transform:
            template: "admin_token"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hnf-admin-password
      rewrite:
        - transform:
            template: "admin_password"
---
# Shared PostgreSQL superuser password, read from the databases namespace so
# the init Job can create the hnf role and database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-auth-shared
  namespace: hnf
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-databases
    kind: ClusterSecretStore
  target:
    name: postgresql-auth-shared
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: postgresql-auth
        property: postgres-password
