apiVersion: v1
kind: ConfigMap
metadata:
  name: hnf-config
  namespace: hnf
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  DEBUG: 'False'
  # cloudflared reaches the frontend Service in-cluster and forwards the public
  # Host header, so Django must accept the public name as well as the internal
  # ingress and the Service DNS names.
  ALLOWED_HOSTS: 'hnf.alcocer.net,hnf.k.alcocer.net,hnf-backend,hnf-backend.hnf.svc.cluster.local,localhost,127.0.0.1'
  CSRF_TRUSTED_ORIGINS: 'https://hnf.alcocer.net,https://hnf.k.alcocer.net'
  # Same origin in production (nginx proxies /api), so CORS barely applies.
  CORS_ALLOWED_ORIGINS: 'https://hnf.alcocer.net,https://hnf.k.alcocer.net'
  # Google OAuth web client id (not a secret). Set it after creating the OAuth
  # client in Google Cloud Console — see docs/DEPLOY.md. Empty disables login.
  GOOGLE_CLIENT_ID: ''
  ADMIN_EMAIL: 'm.alcocer1978@gmail.com'
  ACCESS_TOKEN_LIFETIME_MINUTES: '120'
  REFRESH_TOKEN_LIFETIME_DAYS: '30'
